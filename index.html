<html>
<head>
  <title>Ammar AI Tutor 📚</title>

    body { font-family: Arial; text-align: center; padding: 20px; background: #f0f8ff; }

    select, input, button { padding: 10px; margin: 5px; border-radius: 8px; border: 1px solid #ccc; }
    button { background: #4CAF50; color: white; cursor: pointer; }
    button:hover { background: #45a049; }
    #answer { margin-top: 20px; padding: 15px; background: white; border-radius: 10px; text-align: left; }
    #history { margin-top: 30px; text-align: left; background: #fff3cd; padding: 10px; border-radius: 10px; }

</head>
<body>
  <img src="logo.jpeg" alt="Ammar AI Tutor Logo" width="120">
  <h1>Ammar AI Tutor 📚</h1>

  <label>Class Select karein: </label>
  <select id="class">
    <option>3rd Class</option>
    <option>4th Class</option>
    <option>5th Class</option>
    <option>6th Class</option>
    <option>7th Class</option>
    <option>8th Class</option>
    <option>9th Class</option>
    <option>10th Class</option>
    <option>1st Year</option>
    <option>2nd Year</option>
    <option>B.Com</option>
  </select>
  <br>

  <label>Book: </label>
  <input type="text" id="book" placeholder="Jaise: Math, Science, English">
  <br>

  <input type="text" id="box" placeholder="Apna sawal likho...">
  <button id="btn" onclick="ask()">Answer Lein</button>
  
  <div id="answer">Ji Sir, Class aur Book select karke sawal poochein!</div>

  <div id="history"><b>📖 History:</b></div>

<script>
let history = JSON.parse(localStorage.getItem("ammar_history")) || [];

function ask() {
  let cls = document.getElementById("class").value;
  let book = document.getElementById("book").value;
  let q = document.getElementById("box").value;
  
  if(q.trim() === "" || book.trim() === "") {
    document.getElementById("answer").innerText = "Ji Sir, pehle Class, Book aur Sawal likh dein.";
    return;
  }

  let fullQuestion = `Class: ${cls} | Book: ${book} | Sawal: ${q}`;
  document.getElementById("answer").innerText = "Ji Sir, ${cls} ki ${book} se jawab: " + q + " ka jawab AI dega...";

  // History me save
  history.push(fullQuestion);
  localStorage.setItem("ammar_history", JSON.stringify(history));
  showHistory();
  
  document.getElementById("box").value = ""; // box clear
}
