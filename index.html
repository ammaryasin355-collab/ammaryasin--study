<!DOCTYPE html>
<html>
<head>
<title>Ammaryasin Study AI Tutor</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:white;padding:30px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,0.1);width:90%;max-width:500px;text-align:center}
input{width:80%;padding:12px;border:2px solid #ddd;border-radius:10px;margin-bottom:10px}
button{background:#2b6cb0;color:white;border:none;padding:12px 25px;border-radius:10px;cursor:pointer}
#answer{margin-top:20px;text-align:left;background:#f9fafb;padding:15px;border-radius:10px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
<h1>Ammaryasin<br>Study AI Tutor</h1>
<p>Assalam o Alaikum! Koi bhi sawal poocho, me step by step samjhaunga.</p>
<input type="text" id="question" placeholder="Yahan apna sawal likho...">
<br>
<button onclick="askAI()">Send</button>
<div id="answer"></div>
</div>

<script>
const API_KEY = ""; // Yahan khali rahega

async function askAI() {
  const question = document.getElementById("question").value;
  const answerBox = document.getElementById("answer");
  if(!question) return;
  
  answerBox.innerHTML = "Socha raha hun... 🤔";
  
  try {
    const res = await fetch("/.netlify/functions/groq", {
      method: "POST",
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    answerBox.innerHTML = data.answer;
  } catch(e) {
    answerBox.innerHTML = "Error aa gaya. Thori der baad try karo.";
  }
}
</script>
</body>
</html>
