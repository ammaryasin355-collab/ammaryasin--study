<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ammaryasin Study AI Tutor</title>
<style>
body{font-family:sans-serif;background:#f0f8ff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:white;padding:30px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,0.1);width:90%;max-width:500px;text-align:center}
h1{color:#2563eb}
input{width:80%;padding:12px;border:2px solid #ddd;border-radius:10px;margin:10px 0}
button{background:#2563eb;color:white;border:none;padding:12px 25px;border-radius:10px;cursor:pointer}
button:hover{background:#1d4ed8}
#answer{margin-top:20px;text-align:left;background:#f9fafb;padding:15px;border-radius:10px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
  <div>📚</div>
  <h1>Ammaryasin<br>Study AI Tutor</h1>
  <p>Assalam o Alaikum! Koi bhi sawal poocho, me step by step samjhaunga.</p>
  <input type="text" id="question" placeholder="Yahan apna sawal likho...">
  <br>
  <button onclick="askAI()">Send</button>
  <div id="answer"></div>
</div>

<script>
 const API_KEY = "";

async function askAI() {
  const question = document.getElementById("question").value;
  const answerBox = document.getElementById("answer");
  if(!question) return;
  
  answerBox.innerHTML = "Socha raha hun... 🤔";
  
  const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${API_KEY}`
    },
    body: JSON.stringify({
      model: "llama-3.1-8b-instant",
      messages: [{role: "user", content: "Tum ek Urdu teacher ho. Sawal ka jawab step by step, asaan Urdu me do: " + question}]
    })
  });
  
  const data = await response.json();
  const answer = data.choices[0].message.content;
  answerBox.innerHTML = "<b>Jawab:</b><br>" + answer;
}
</script>
</body>
</html>
