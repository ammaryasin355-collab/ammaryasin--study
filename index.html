<!DOCTYPE html>
<html>
<head>
  <title>Ammar AI Tutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background: #f5f7fa; margin:0; padding:0; }
    .header { background: #2563eb; color: white; padding: 20px; text-align: center; }
    .header h1 { margin: 5px 0; }
    .tabs { display: flex; justify-content: center; gap: 10px; margin: 15px; flex-wrap: wrap; }
    .tab { padding: 8px 15px; background: #e5e7eb; border-radius: 20px; cursor: pointer; }
    .tab.active { background: #2563eb; color: white; }
    .card { background: white; margin: 15px; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px #ddd; }
    textarea { width: 95%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    .btn { width: 95%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #1e40af; }
    .features { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; margin: 15px; }
    .feature { background: white; padding: 15px; border-radius: 10px; }
    #answer { margin-top: 15px; padding: 15px; background: #eff6ff; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📚 Ammar AI Tutor</h1>
    <p>Solve problems with Text or Images</p>
  </div>

  <div class="tabs">
    <div class="tab active">General</div>
    <div class="tab">Urdu</div>
    <div class="tab">English</div>
    <div class="tab">+ Math</div>
  </div>

  <div class="card">
    <button class="btn" style="background:#2563eb;">📝 Text Question</button>
    <button class="btn" style="background:#e5e7eb; color:black;">📷 Upload Image</button>
    
    <textarea id="box" placeholder="Type your question here. You can ask in Urdu or English.
Examples:
- Pakistan ka darulhukoomat kya hai?
- Solve 2x + 5 = 15"></textarea>
    
    <button class="btn" onclick="solve()">🚀 Solve Question</button>
    
    <div id="answer">Ji Sir, sawal likh kar "Solve Question" dabayen</div>
  </div>

  <div class="features">
    <div class="feature">🌐<br><b>Multi-Language</b><br>Urdu, English</div>
    <div class="feature">📖<br><b>All Subjects</b><br>3rd Class to B.Com</div>
    <div class="feature">🖼️<br><b>Image Support</b><br>Photo se sawal</div>
    <div class="feature">⚡<br><b>Instant AI</b><br>Turant jawab</div>
  </div>

<script>
function solve() {
  let q = document.getElementById("box").value;
  if(q.trim() === "") {
    document.getElementById("answer").innerText = "Pehle sawal likh dein Sir";
    return;
  }
  document.getElementById("answer").innerText = "Ji Sir, aapka sawal: " + q + "\n\nJawab AI abhi dega...";
  
  // Yahan baad me asal AI connect karenge
}
</script>

</body>
</html>
